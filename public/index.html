function bnew(){BF={cats:[],all:0,m:'',per:'m',cs:TD,ce:TD,w:'all',rep:0};bform()}
function bform(m=''){const t=BF.all?'All categories':BF.cats.length?BF.cats.slice(0,2).join(', ')+(BF.cats.length>2?' +'+(BF.cats.length-2):''):'Select category';
sh(`<div class=row><b>Add Budget</b><a onclick=cl()>✕</a></div><div class=li onclick="bcp()" style="border:1px solid var(--l);border-radius:10px;padding:8px 10px">${ic(BF.all?'Total':(BF.cats[0]||'?'),36)}<div>${t}</div><span>›</span></div><small>Amount (₱)</small><input type=number value="${BF.m}" oninput="BF.m=this.value"><small>Period</small><select onchange="BF.per=this.value;bform()">${[['w','This week'],['m','This month'],['q','This quarter'],['y','This year'],['c','Custom']].map(([k,l])=>`<option value=${k} ${BF.per==k?'selected':''}>${l}${k!='c'?' ('+brg(k).map(fd).join(' - ')+')':''}</option>`).join('')}</select>${BF.per=='c'?`<small>From</small><input type=date value="${BF.cs}" onchange="BF.cs=this.value"><small>To</small><input type=date value="${BF.ce}" onchange="BF.ce=this.value">`:`<label class=row style="padding:10px 0;justify-content:flex-start">Repeat this budget (renews automatically) <input type=checkbox style="width:auto" ${BF.rep?'checked':''} onchange="BF.rep=+this.checked"></label>`}<small>Wallet</small><select onchange="BF.w=this.value=='all'?'all':+this.value">${[['all','Total'],...aw().map(w=>[w.id,w.n])].map(([v,l])=>`<option value="${v}" ${BF.w==v?'selected':''}>${l}</option>`).join('')}</select><small style="color:var(--r)">${m}</small><button class=btn onclick=bsv()>Save</button>`)}
function bcp(){const sw=(on,fn)=>`<input type=checkbox style="width:auto" ${on?'checked':''} onchange="${fn}">`;sh(`<div class=row><a onclick=bform() style="font-size:24px;text-decoration:none">←</a><b>Select category</b><a onclick=bform()>DONE</a></div><div class=li><div>All categories</div>${sw(BF.all,'BF.all=+this.checked;bcp()')}</div><small>EXPENSE</small>${grp('e').map((c,i)=>`<div class=li style="padding-left:${c[3]?30:0}px">${ic(c[0],36)}<div>${c[0]}</div>${sw(BF.all||BF.cats.includes(c[0]),`bt(${i},this.checked)`)}</div>`).join('')}`)}
function bt(i,on){const L=grp('e'),c=L[i],ids=c[3]?[c[0]]:L.filter(x=>x[0]==c[0]||x[3]==c[0]).map(x=>x[0]);if(BF.all){BF.cats=L.map(x=>x[0]);BF.all=0}BF.cats=on?[...new Set([...BF.cats,...ids])]:BF.cats.filter(n=>!ids.includes(n));bcp()}
function bsv(){const m=+BF.m,cs=BF.all?C.filter(c=>c[4]=='e').map(c=>c[0]):BF.cats;if(!(m>0))return bform('Enter an amount');if(!cs.length)return bform('Select at least one category');const[s,e]=BF.per=='c'?[BF.cs,BF.ce]:brg(BF.per);if(!s||!e||e<s)return bform('Check the dates');const p=C.find(c=>!c[3]&&cs.includes(c[0])&&C.filter(x=>x[3]==c[0]).every(x=>cs.includes(x[0]))),nm=BF.all?'All categories':cs.length==1?cs[0]:(p&&cs.length==1+C.filter(x=>x[3]==p[0]).length?p[0]:cs[0]+' +'+(cs.length-1));S.b.push({id:Date.now(),nm,ico:BF.all?'Total':cs[0],cats:cs,all:BF.all,m,per:BF.per,s,e,w:BF.w,rep:BF.per!='c'&&BF.rep?1:0});save();cl();render()}
let WO=0;
const so=()=>{TK='';try{localStorage.removeItem('mmt')}catch(e){}login()};
function login(m=''){$('#v').innerHTML=`<div class=card style="margin-top:12vh"><h2>Money Manager</h2><input id=lu placeholder="Email or username" autocapitalize=none><input id=lp type=password placeholder="Password"><small style="color:var(--r)">${m}</small><button class=btn onclick="go('login')">Sign in</button><button class=btn style="background:var(--l);color:var(--t)" onclick="go('register')">Create account</button><p style="text-align:center"><a onclick=fp()>Forgot password?</a></p></div>`;$('nav').style.display='none'}
async function go(a){const r=await api('auth','POST',{a,u:$('#lu').value,p:$('#lp').value});if(!r.ok)return login(r.j.error||'Something went wrong');TK=r.j.token;try{localStorage.setItem('mmt',TK)}catch(e){}boot()}
async function boot(){if(RT)return np();if(!TK)return login();const r=await api('data');if(!r.ok)return login();S=Object.assign(seed(),r.j.data||{});S.set=Object.assign(seed().set,S.set||{});C.length=NB;S.cc.forEach(c=>C.push(c));if(S.dark)document.documentElement.dataset.theme=S.dark;$('nav').style.display='flex';render()}
boot();
